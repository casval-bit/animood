# electron-builder configuration for AniMood Desktop
# https://www.electron.build/configuration/configuration
#
# The installed app loads the live website (see electron/main.js), so only the
# Electron shell is packaged. Builds run on GitHub Actions (.github/workflows/desktop-release.yml).

appId: com.animood.desktop
productName: AniMood
copyright: "Copyright © 2026 AniMood"

directories:
  buildResources: public
  output: dist-electron

files:
  - electron/**/*       # Main process, preload, offline page, icon
  - package.json

# Ad-hoc signature on macOS (free; avoids the "app is damaged" error on Apple Silicon)
afterPack: build-hooks/mac-adhoc-sign.cjs

# macOS — not signed with an Apple certificate (paid): first launch needs "Open Anyway"
mac:
  category: public.app-category.entertainment
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip       # required by the auto-updater
      arch: [x64, arm64]
  icon: public/icons/icon-512.png
  identity: null
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"

dmg:
  sign: false

# Windows
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/logo-mark.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: "${productName}-Setup-${version}.${ext}"

# Linux
linux:
  target:
    - AppImage
    - deb
  icon: public/icons/icon-512.png
  category: Network
  maintainer: "AniMood <mousjabie@gmail.com>"
  artifactName: "${productName}-${version}-linux-${arch}.${ext}"

# Auto-updater — reads GitHub releases
publish:
  provider: github
  owner: casval-bit
  repo: animood
  releaseType: release

# Deep-link protocol (animood://) — streaming links + Google login callback
protocols:
  name: AniMood
  schemes:
    - animood
