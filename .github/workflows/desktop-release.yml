# Appli de bureau AniMood — compile Windows / macOS / Linux et publie une release GitHub.
#
# Publier une version :
#   1. mettre le même numéro dans package.json ("version": "11.3.0")
#   2. git tag v11.3.0 && git push origin v11.3.0
# → la page « Télécharger l'appli » du site et les mises à jour automatiques de l'appli
#   utilisent cette release toute seules.
#
# Lancement manuel (onglet Actions → Run workflow) : compile seulement, sans publier ;
# les installateurs sont téléchargeables dans les « Artifacts » du run.

name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"   # electron-builder télécharge sa propre copie
      CSC_IDENTITY_AUTO_DISCOVERY: "false" # pas de certificat payant : signature ad hoc sur Mac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à package.json ($PKG)"
            exit 1
          fi

      - run: npm ci

      - name: Build installers
        run: npx electron-builder ${{ matrix.target }} --config electron-builder.yml --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: animood-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.blockmap
            dist-electron/latest*.yml

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "AniMood $GITHUB_REF_NAME" \
            --generate-notes
