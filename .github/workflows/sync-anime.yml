name: Sync Anime Database

# Hebdomadaire (le dimanche) : rafraîchissement COMPLET des scores de tous les animés + plateformes, quiz OP, artistes.
# Quotidien (sync-daily.yml) : nouveaux animés, diffusion, humeurs. Mensuel (sync-monthly.yml) : trailers + pays.
on:
  schedule:
    - cron: '0 5 * * 0'  # Every Sunday at 5am UTC (après le quotidien de 3h)
  workflow_dispatch:       # Manual trigger from GitHub UI

permissions:
  contents: read

concurrency:
  group: animood-sync
  cancel-in-progress: false

defaults:
  run:
    shell: bash          # active « pipefail » : un script qui plante fait échouer l'étape (sinon « | tee » le masque)

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
      OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Chaque étape continue même si la précédente échoue ; le résumé en bas et la croix rouge indiquent laquelle a planté.
      - name: Sync new anime to Supabase (Jikan + scores + saisons)
        id: sync_anime
        continue-on-error: true
        run: node scripts/sync_new_anime.mjs 2>&1 | tee /tmp/anime_log.txt

      - name: Weekly job (new anime AniList, broadcast, scores, moods v4, rescore)
        id: sync_weekly
        continue-on-error: true
        run: node scripts/animood_sync.mjs --job=weekly 2>&1 | tee /tmp/weekly_log.txt

      - name: Streaming platforms (Jikan)
        id: sync_streaming
        continue-on-error: true
        run: node scripts/animood_sync.mjs --job=streaming 2>&1 | tee /tmp/streaming_log.txt

      - name: Alternative titles (custom streaming platforms)
        id: sync_titles
        continue-on-error: true
        run: node scripts/sync_alt_titles.mjs 2>&1 | tee /tmp/titles_log.txt

      - name: Expand Quiz OP opening pool
        id: sync_opquiz
        continue-on-error: true
        run: node scripts/sync_opquiz_pool.mjs 2>&1 | tee /tmp/opquiz_log.txt

      - name: Refresh Artist tab cache
        id: sync_artists
        continue-on-error: true
        run: node scripts/sync_artists.mjs 2>&1 | tee /tmp/artists_log.txt

      - name: Write summary
        if: always()
        run: |
          show() { echo "### $1 — ${2:-?}" >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY; tail -${4:-5} "$3" >> $GITHUB_STEP_SUMMARY 2>/dev/null; echo '```' >> $GITHUB_STEP_SUMMARY; echo "" >> $GITHUB_STEP_SUMMARY; }
          echo "## 🌀 AniMood — Sync Report $(date '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          show "📺 New anime + scores" "${{ steps.sync_anime.outcome }}" /tmp/anime_log.txt 8
          show "🗓️ Weekly job (moods v4, broadcast, rescore)" "${{ steps.sync_weekly.outcome }}" /tmp/weekly_log.txt 5
          show "📡 Streaming platforms" "${{ steps.sync_streaming.outcome }}" /tmp/streaming_log.txt 3
          show "🔤 Alternative titles" "${{ steps.sync_titles.outcome }}" /tmp/titles_log.txt 3
          show "🎵 Quiz OP pool" "${{ steps.sync_opquiz.outcome }}" /tmp/opquiz_log.txt 5
          show "🎤 Artist cache" "${{ steps.sync_artists.outcome }}" /tmp/artists_log.txt 3
