<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniMood</title>

    <!-- ─── PWA Meta ─────────────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AniMood" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Dev only: drop any service worker left over from a prod build. Its
         cache-first rule would otherwise serve stale /src/*.js modules and
         break the import graph (white screen). Inline so it runs even when
         main.jsx can't load. -->
    <script>
      if ("%MODE%" === "development" && "serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(async (regs) => {
          if (!regs.length) return;
          await Promise.all(regs.map((r) => r.unregister()));
          if (window.caches) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
          }
          location.reload();
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
