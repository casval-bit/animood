  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:32px;font-family:system-ui,sans-serif;color:#cbd5e1;background:#070b17;min-height:100vh">
        <h1 style="font-size:22px;color:#fff">AniMood</h1>
        <p>Choisis ton humeur et AniMood te propose des animés faits pour ce moment. JavaScript est nécessaire pour utiliser l'application : active-le dans ton navigateur.</p>
        <p lang="en">Pick your mood and AniMood suggests anime made for the moment. JavaScript is required to use the app — please enable it in your browser.</p>
      </div>
    </noscript>
    <!-- Dev only: drop any service worker left over from a prod build. Its
         cache-first rule would otherwise serve stale /src/*.js modules and
         break the import graph (white screen). Inline so it runs even when
         main.jsx can't load. -->
    <script>
      if ("%MODE%" === "development" && "serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(async (regs) => {
          if (!regs.length) return;
          await Promise.all(regs.map((r) => r.unregister()));
          if (window.caches) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
          }
          location.reload();
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
