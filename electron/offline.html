<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'" />
  <title>AniMood — hors ligne</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #020617; color: #e2e8f0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-app-region: drag;
    }
    .card { text-align: center; max-width: 360px; padding: 24px; }
    img { width: 72px; height: 72px; border-radius: 20px; }
    h1 { font-size: 20px; margin: 18px 0 6px; }
    p { font-size: 13px; color: #94a3b8; line-height: 1.6; margin: 0 0 22px; }
    button {
      -webkit-app-region: no-drag;
      border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer;
      font-size: 13px; font-weight: 800; color: #fff;
      background: linear-gradient(135deg, #7c3aed, #ec4899);
    }
    .win { display: none; position: fixed; top: 0; right: 0; -webkit-app-region: no-drag; }
    .win button { -webkit-app-region: no-drag; background: transparent; border-radius: 0; width: 42px; height: 30px; padding: 0; color: #c4b5fd; font-size: 14px; font-weight: 400; }
    .win button:hover { background: rgba(139,92,246,.28); color: #fff; }
    .win button.x:hover { background: rgba(239,68,68,.9); }
  </style>
</head>
<body>
  <div class="win" id="win"><button id="min" title="Réduire">&#8211;</button><button id="max" title="Agrandir">&#9633;</button><button id="close" class="x" title="Fermer">&#10005;</button></div>
  <div class="card">
    <img src="icon.png" alt="" />
    <h1>Pas de connexion</h1>
    <p>AniMood n'arrive pas à joindre le serveur. Vérifie ta connexion Internet puis réessaie.</p>
    <button id="retry">Réessayer</button>
  </div>
  <script>
    const retry = () => window.animood?.retryLoad?.();
    document.getElementById("retry").addEventListener("click", retry);
    window.addEventListener("online", retry);
    if (window.animood?.customFrame) {
      document.getElementById("win").style.display = "flex";
      document.getElementById("min").onclick = () => window.animood.minimize();
      document.getElementById("max").onclick = () => window.animood.maximize();
      document.getElementById("close").onclick = () => window.animood.close();
    }
  </script>
</body>
</html>
